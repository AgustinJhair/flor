<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
  (() => {
    const url = new URL(window.location.href);
    const current = url.searchParams.get('v');
    if (!current) {
      url.searchParams.set('v', String(Date.now()));
      window.history.replaceState({}, '', url);
    }
  })();
</script>
<title>Para ti Iris 🌷❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.55), transparent 18%),
        radial-gradient(circle at 80% 30%, rgba(179, 221, 255, 0.24), transparent 20%),
        linear-gradient(180deg, #0b1220 0%, #111b2d 28%, #1a2940 100%);
}

body::before,
body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
}

body::before {
    width: 170px;
    height: 170px;
    left: 50%;
    top: 70px;
    transform: translateX(-50%);
    background: radial-gradient(circle at 35% 35%, #fffef7 0%, #fdf4b0 34%, #d4d1ff 100%);
    box-shadow: 0 0 16px rgba(255, 246, 170, 0.6), 0 0 30px rgba(160, 180, 255, 0.2);
}

body::after {
    width: 100%;
    height: 100%;
    inset: 0;
    background-image:
        radial-gradient(2.5px 2.5px at 8% 18%, rgba(255,255,255,1) 0, transparent 100%),
        radial-gradient(2.5px 2.5px at 16% 28%, rgba(255,255,255,1) 0, transparent 100%),
        radial-gradient(2px 2px at 28% 16%, rgba(255,255,255,0.9) 0, transparent 100%),
        radial-gradient(2px 2px at 40% 24%, rgba(255,255,255,0.9) 0, transparent 100%),
        radial-gradient(2.5px 2.5px at 60% 12%, rgba(255,255,255,1) 0, transparent 100%),
        radial-gradient(2px 2px at 67% 24%, rgba(255,255,255,0.9) 0, transparent 100%),
        radial-gradient(2px 2px at 76% 18%, rgba(255,255,255,0.9) 0, transparent 100%),
        radial-gradient(2.5px 2.5px at 88% 20%, rgba(255,255,255,1) 0, transparent 100%),
        radial-gradient(2px 2px at 92% 16%, rgba(255,255,255,0.9) 0, transparent 100%),
        radial-gradient(2px 2px at 12% 74%, rgba(255,255,255,0.9) 0, transparent 100%),
        radial-gradient(2.5px 2.5px at 24% 82%, rgba(255,255,255,1) 0, transparent 100%),
        radial-gradient(2.5px 2.5px at 78% 78%, rgba(255,255,255,1) 0, transparent 100%),
        radial-gradient(2px 2px at 90% 76%, rgba(255,255,255,0.9) 0, transparent 100%);
    opacity: 1;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.7));
}

.mensaje {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 750px;
    text-align: center;
    z-index: 20;
}

.foto-corazon {
    position: fixed;
    right: 5%;
    top: 68%;
    width: 90px;
    height: 90px;
    z-index: 12;
    transform: rotate(8deg);
    box-shadow: 0 0 20px rgba(255, 208, 236, 0.9), 0 0 34px rgba(255, 141, 199, 0.75), 0 0 48px rgba(138, 221, 255, 0.7), 0 0 66px rgba(255, 255, 255, 0.38), 0 12px 30px rgba(0, 0, 0, 0.18);
    background: #fff;
    clip-path: path("M 50 100 C 44 92, 18 73, 10 50 C 3 31, 9 12, 26 9 C 37 7, 46 15, 50 24 C 54 15, 63 7, 74 9 C 91 12, 97 31, 90 50 C 82 73, 56 92, 50 100 Z");
    overflow: hidden;
    filter: saturate(1.12) contrast(1.1) brightness(1.05);
    border: 1px solid rgba(255, 255, 255, 0.55);
}

.foto-corazon::before {
    content: "";
    position: absolute;
    inset: 8px 10px 8px 10px;
    border-radius: 48% 52% 46% 54% / 56% 43% 57% 44%;
    background: linear-gradient(90deg, rgba(255,255,255,0.18), rgba(255,145,214,0.18), rgba(144,208,255,0.18), rgba(255,255,255,0.12));
    box-shadow: inset 0 0 12px rgba(255,255,255,0.4), inset 0 0 18px rgba(255,145,214,0.25);
    filter: blur(4px);
    pointer-events: none;
}

.foto-corazon:nth-of-type(2) {
    left: 5%;
    right: auto;
    top: 68%;
    transform: rotate(-8deg);
}

.foto-corazon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: saturate(1.08) contrast(1.08);
}

.mensaje h1 {
    color: #f5d5e7;
    font-size: 42px;
    margin-bottom: 15px;
    text-shadow: 0 0 18px rgba(255, 196, 225, 0.6), 0 4px 14px rgba(255, 255, 255, 0.12);
}

#texto {
    color: #dfe9ff;
    font-size: 18px;
    line-height: 1.7;
    min-height: 250px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
}

.jardin {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 40%;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 45px;
}

.flor {
    position: relative;
    width: 70px;
    height: 260px;
    animation: balanceo 3s ease-in-out infinite;
    transform-origin: bottom center;
}

.flor:nth-child(2) {
    animation-delay: .5s;
}

.flor:nth-child(3) {
    animation-delay: 1s;
}

.flor:nth-child(4) {
    animation-delay: 1.5s;
}

@keyframes balanceo {
    0%, 100% {
        transform: rotate(-4deg);
    }

    50% {
        transform: rotate(4deg);
    }
}

.tallo {
    position: absolute;
    width: 8px;
    height: 190px;
    background: linear-gradient(#4dbd7d, #2d8f5c);
    left: 31px;
    bottom: 0;
    border-radius: 10px;
    box-shadow: inset 0 0 4px rgba(255,255,255,0.4);
}

.hoja {
    position: absolute;
    width: 70px;
    height: 30px;
    background: linear-gradient(#6fdb8c, #42a661);
    border-radius: 100% 0;
    bottom: 65px;
    left: -20px;
    transform: rotate(-25deg);
    box-shadow: 0 4px 8px rgba(38, 120, 76, 0.15);
}

.hoja2 {
    position: absolute;
    width: 70px;
    height: 30px;
    background: linear-gradient(#6fdb8c, #42a661);
    border-radius: 0 100%;
    bottom: 100px;
    left: 20px;
    transform: rotate(25deg);
    box-shadow: 0 4px 8px rgba(38, 120, 76, 0.15);
}

.tulipan {
    position: absolute;
    width: 68px;
    height: 75px;
    left: 1px;
    bottom: 175px;
    background: linear-gradient(#89d9ff, #76baf6);
    border-radius: 50% 50% 35% 35%;
    z-index: 5;
    box-shadow: 0 8px 18px rgba(92, 143, 204, 0.35);
}

.tulipan::before {
    content: "";
    position: absolute;
    width: 34px;
    height: 75px;
    left: -8px;
    top: 0;
    background: linear-gradient(#89d9ff, #76baf6);
    border-radius: 50% 20% 40% 40%;
    transform: rotate(-15deg);
}

.tulipan::after {
    content: "";
    position: absolute;
    width: 34px;
    height: 75px;
    right: -8px;
    top: 0;
    background: linear-gradient(#89d9ff, #76baf6);
    border-radius: 20% 50% 40% 40%;
    transform: rotate(15deg);
}

.corazon {
    position: fixed;
    top: -50px;
    font-size: 25px;
    animation: caer linear infinite;
    z-index: 30;
    pointer-events: none;
}

.botones {
    position: absolute;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    display: flex;
    justify-content: center;
    z-index: 40;
}

.boton {
    padding: 12px 26px;
    border: 1px solid rgba(255,255,255,0.45);
    border-radius: 999px;
    background: linear-gradient(135deg, #f7d7ef 0%, #d8e9ff 45%, #c8f3ff 100%);
    color: #1f2a3d;
    font-weight: 700;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(150, 180, 255, 0.32), 0 0 20px rgba(255, 196, 225, 0.32);
}

.boton:hover {
    filter: brightness(1.05);
}

@keyframes caer {
    0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}

@media (max-width: 600px) {
    .mensaje {
        top: 15px;
        width: 92%;
    }

    .mensaje h1 {
        font-size: 28px;
    }

    #texto {
        font-size: 15px;
        line-height: 1.4;
        min-height: 280px;
    }

    .jardin {
        gap: 10px;
        height: 32%;
    }

    .flor {
        transform: scale(.7);
    }

    .flor:nth-child(2),
    .flor:nth-child(3),
    .flor:nth-child(4) {
        animation-delay: 0s;
    }
}
</style>
</head>
<body>

<div class="foto-corazon">
    <img src="foto-iris.jpg/Captura de pantalla 2026-09-22 002711.png" alt="Iris">
</div>

<div class="foto-corazon" style="left: 5%; right: auto; top: 68%; transform: rotate(-8deg);">
    <img src="foto-iris.jpg/Captura de pantalla 2026-09-22 002711.png" alt="Iris">
</div>

<div class="mensaje">
    <h1>🌷 Para ti Iris 🌷</h1>
    <p id="texto"></p>
</div>

<div class="jardin">
    <div class="flor">
        <div class="tulipan"></div>
        <div class="tallo"></div>
        <div class="hoja"></div>
        <div class="hoja2"></div>
    </div>

    <div class="flor">
        <div class="tulipan"></div>
        <div class="tallo"></div>
        <div class="hoja"></div>
        <div class="hoja2"></div>
    </div>

    <div class="flor">
        <div class="tulipan"></div>
        <div class="tallo"></div>
        <div class="hoja"></div>
        <div class="hoja2"></div>
    </div>

    <div class="flor">
        <div class="tulipan"></div>
        <div class="tallo"></div>
        <div class="hoja"></div>
        <div class="hoja2"></div>
    </div>
</div>

<div class="botones">
    <button class="boton">Para ti Iris ❤️</button>
</div>

<script>
const frase = `Quise regalarte estos tulipanes porque hay días en los que las palabras se quedan cortas, y aun así quiero que sientas lo mucho que te valoro, Iris. 🌷❤️

Tú tienes esa manera de hacer que el mundo se vea más bonito, más tranquilo y más lleno de luz. Cada momento contigo se vuelve especial, y cada recuerdo contigo se guarda con cariño.

Gracias por ser esa persona que hace que mi sonrisa se note más, por compartir risas, palabras y momentos que se quedan en el corazón. Espero que estos tulipanes te recuerden lo mucho que te quiero y lo feliz que me hace tenerte cerca. 💗🌷`;

const texto = document.getElementById("texto");
let i = 0;

function escribir() {
    if (i < frase.length) {
        if (frase[i] === "\n") {
            texto.innerHTML += "<br><br>";
        } else {
            texto.innerHTML += frase[i];
        }
        i++;
        setTimeout(escribir, 35);
    }
}

escribir();

const corazones = ["❤️", "💕", "💗", "💖", "🌷", "🌹"];

function crearCorazon() {
    const x = Math.random() * 100;

    if (x > 30 && x < 70) {
        return;
    }

    const corazon = document.createElement("div");
    corazon.classList.add("corazon");
    corazon.innerHTML = corazones[Math.floor(Math.random() * corazones.length)];
    corazon.style.left = x + "vw";
    corazon.style.fontSize = (15 + Math.random() * 25) + "px";
    corazon.style.animationDuration = (4 + Math.random() * 5) + "s";

    document.body.appendChild(corazon);

    setTimeout(() => {
        corazon.remove();
    }, 9000);
}

setInterval(crearCorazon, 500);

const boton = document.querySelector('.boton');
if (boton) {
    boton.addEventListener('click', () => {
        for (let i = 0; i < 26; i++) {
            setTimeout(() => {
                const corazon = document.createElement('div');
                corazon.classList.add('corazon');
                corazon.innerHTML = corazones[Math.floor(Math.random() * corazones.length)];
                corazon.style.left = (25 + Math.random() * 50) + 'vw';
                corazon.style.fontSize = (18 + Math.random() * 28) + 'px';
                corazon.style.animationDuration = (2.5 + Math.random() * 3.8) + 's';
                document.body.appendChild(corazon);
                setTimeout(() => corazon.remove(), 6500);
            }, i * 70);
        }
    });
}
</script>

</body>
</html>
